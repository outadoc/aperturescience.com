name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-minitel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test the Minitel service (JVM and JS) and the website
        run: ./gradlew :ui-minitel-core:allTests :ui-minitel:build :ui-minitel:buildImage :ui-minitel-worker:jsNodeProductionLibraryDistribution :ui-web:wasmJsBrowserDistribution
        env:
          # Reads outadoc/minipavi-kotlin from GitHub Packages
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
