<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperture Science Employment Terminal</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
    <pre id="terminal" aria-live="polite"></pre>
    <input id="mobile-input" type="text" tabindex="-1" aria-label="Terminal input"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    <video id="trailer" src="portal-trailer.mp4" controls playsinline></video>
    <video id="security-video" src="security02.mp4" loop muted playsinline></video>
    <noscript>This terminal requires JavaScript and WebAssembly support to run.</noscript>
    <script type="module" src="ui-web.js"></script>
</body>
</html>
